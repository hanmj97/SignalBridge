name: SignalBridge CI
'on':
  push:
  pull_request:

permissions:
  contents: read

jobs:
  secret-and-source-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify tracked files and secrets (never print values)
        run: python tools/phase15_preflight.py --ci
      - name: Self-test preflight
        run: python -m unittest discover -s tools -p 'test_*.py' -v

  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: airflow/collector-requirements.txt
      - name: Install runtime deps required by unit tests
        run: python -m pip install -r airflow/collector-requirements.txt
      - name: Test Airflow DAG contracts and notifications
        run: python -m unittest discover -s airflow/tests -v
      - name: Test Python collector
        run: python -m unittest discover -s collector/tests -v

  java-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Maven test (no external production database)
        working-directory: backend
        run: mvn -B -ntp test

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        working-directory: frontend
        run: |
          if [ -f package-lock.json ]; then npm ci --no-audit --no-fund
          else npm install --no-audit --no-fund
          fi
      - name: TypeScript and Vite build
        working-directory: frontend
        run: npm run build

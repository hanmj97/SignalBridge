# SignalBridge Phase 6: local-only Airflow orchestration.
# Use together with the existing docker-compose.yml.
# Existing postgres/volumes are not changed.
services:
  airflow:
    build:
      context: ./airflow
      dockerfile: Dockerfile
    image: signalbridge-airflow:phase6
    container_name: signalbridge-airflow
    restart: unless-stopped
    environment:
      AIRFLOW_HOME: /opt/airflow
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__DEFAULT_TIMEZONE: Asia/Seoul
      AIRFLOW__WEBSERVER__WEB_SERVER_PORT: "8080"
      AIRFLOW__WEBSERVER__BASE_URL: http://localhost:8082
      PYTHONPATH: /opt/airflow
      # A container resolves the PostgreSQL service by its Compose DNS name.
      SIGNALBRIDGE_DB_HOST: postgres
      SIGNALBRIDGE_DB_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-signalbridge}
      POSTGRES_USER: ${POSTGRES_USER:-signalbridge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Create .env before running Docker Compose}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      SIGNALBRIDGE_DISCORD_WEBHOOK_URL: ${SIGNALBRIDGE_DISCORD_WEBHOOK_URL:-}
    ports:
      # Localhost only: the Airflow admin interface must not be public.
      - "127.0.0.1:8082:8080"
    volumes:
      # SQLite metadata, Airflow config and task logs survive a container restart.
      - signalbridge_airflow_home:/opt/airflow
      # Source code is read-only from inside the orchestration container.
      - ./airflow/dags:/opt/airflow/dags:ro
      - ./collector:/opt/airflow/collector:ro
    depends_on:
      postgres:
        condition: service_healthy
    command: standalone

volumes:
  signalbridge_airflow_home:
